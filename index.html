<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNTHEXA - Creando el Futuro de la Humanidad</title>
<style>
/* ... (Todo tu CSS igual) ... */
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #00e5ff; --secondary: #8b5cf6; --accent: #10b981;
  --dark: #0a0118; --darker: #050008; --light: #f0f9ff;
}
/* ... (Usa el CSS que ya tienes, salto al final para el cambio importante) ... */
body { font-family: 'Rajdhani', sans-serif; background: var(--darker); color: var(--light); overflow-x: hidden; line-height: 1.6; }
/* ... (Incluye todo tu CSS aquí) ... */
#chat-window { position:fixed; bottom:110px; right:30px; width:380px; height:550px; background:rgba(5,0,8,.97); border:1px solid rgba(0,229,255,.3); border-radius:20px; display:flex; flex-direction:column; z-index:9998; box-shadow:0 20px 60px rgba(0,229,255,.2); backdrop-filter:blur(20px); transform:scale(.8) translateY(20px); opacity:0; pointer-events:none; transition:all .3s cubic-bezier(.34,1.56,.64,1); }
#chat-window.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }
.msg { max-width:85%; padding:12px 16px; border-radius:16px; font-size:.95rem; line-height:1.5; margin: 5px 0; }
.msg.bot { background:rgba(139,92,246,0.15); align-self:flex-start; border-radius:4px 16px 16px 16px; border:1px solid rgba(139,92,246,0.3); }
.msg.user { background:linear-gradient(135deg,rgba(0,229,255,0.2),rgba(139,92,246,0.2)); align-self:flex-end; border-radius:16px 4px 16px 16px; border:1px solid rgba(0,229,255,0.3); }
.chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; }
</style>
</head>
<body>

<nav>...</nav>
<section class="hero">...</section>
<button id="chat-toggle"><span class="ci">💬</span><span class="cx">✕</span></button>
<div id="chat-window">
  <div class="chat-header">
    <div class="chat-avatar">🤖</div>
    <div>
      <div class="chat-header-name">ZYNTHEXA AI</div>
      <div class="chat-status"><span class="dot"></span> En línea</div>
    </div>
  </div>
  <div class="chat-messages" id="msgs">
    <div class="msg bot">¡Hola! 👋 Soy ZYNTHEXA AI. ¿En qué puedo ayudarte hoy?</div>
  </div>
  <div class="chat-input-area">
    <textarea id="chat-input" placeholder="Escribe un mensaje..." rows="1"></textarea>
    <button id="chat-send">➤</button>
  </div>
</div>

<script>
let busy = false;

document.getElementById('chat-toggle').onclick = () => {
  document.getElementById('chat-window').classList.toggle('open');
};

async function send() {
  const inp = document.getElementById('chat-input');
  const txt = inp.value.trim();
  if (!txt || busy) return;

  // Mostrar mensaje usuario
  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div class="msg user">${txt}</div>`;
  inp.value = '';
  busy = true;
  msgs.scrollTop = msgs.scrollHeight;

  try {
    // LLAMADA A TU SERVIDOR VERCEL (No a Anthropic directo)
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: txt }] })
    });

    const data = await res.json();
    const reply = data.content ? data.content[0].text : "Lo siento, tuve un problema al conectar.";
    
    msgs.innerHTML += `<div class="msg bot">${reply}</div>`;
  } catch (e) {
    msgs.innerHTML += `<div class="msg bot">Error de conexión. Revisa Vercel.</div>`;
  }
  
  busy = false;
  msgs.scrollTop = msgs.scrollHeight;
}

document.getElementById('chat-send').onclick = send;
document.getElementById('chat-input').onkeydown = (e) => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
</script>
</body>
</html>
