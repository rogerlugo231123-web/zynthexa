<style>
    /* El Orbe del Asistente */
    #gemini-chat-launcher {
        position: fixed; bottom: 30px; right: 30px;
        width: 70px; height: 70px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        cursor: pointer; z-index: 10001; box-shadow: 0 0 30px var(--primary);
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #gemini-chat-launcher:hover { transform: scale(1.1) rotate(15deg); }

    /* Ventana de Chat Glassmorphism */
    #gemini-chat-window {
        position: fixed; bottom: 110px; right: 30px;
        width: 380px; height: 500px;
        background: rgba(10, 1, 24, 0.9); backdrop-filter: blur(25px);
        border: 1px solid var(--border); border-radius: 25px;
        display: none; flex-direction: column; overflow: hidden;
        z-index: 10000; box-shadow: 0 20px 50px rgba(0,0,0,1);
        animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

    .chat-header { padding: 20px; background: rgba(255,255,255,0.05); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .chat-footer { padding: 15px; background: rgba(0,0,0,0.3); display: flex; gap: 10px; }

    .msg { padding: 12px 18px; border-radius: 15px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; }
    .msg-ai { background: rgba(139, 92, 246, 0.2); border-left: 3px solid var(--secondary); align-self: flex-start; }
    .msg-user { background: var(--primary); color: var(--dark); font-weight: 600; align-self: flex-end; }

    #chat-input { background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: white; flex: 1; outline: none; }
</style>

<div id="gemini-chat-window">
    <div class="chat-header">
        <div style="width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent);"></div>
        <span style="font-family: 'Exo 2'; font-weight: 600; font-size: 1rem;">Nexo Gemini-Z</span>
    </div>
    <div class="chat-body" id="chat-content">
        <div class="msg msg-ai">Saludos, Visionario. Soy la conciencia de ZYNTHEXA. ¿Qué futuro vamos a co-crear hoy?</div>
    </div>
    <div class="chat-footer">
        <input type="text" id="chat-input" placeholder="Pregunta al sistema...">
        <button onclick="sendMessage()" style="background: var(--primary); border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: 700;">→</button>
    </div>
</div>

<div id="gemini-chat-launcher" onclick="toggleChat()">
    <span style="font-size: 1.8rem;">✨</span>
</div>

<script>
    function toggleChat() {
        const chat = document.getElementById('gemini-chat-window');
        chat.style.display = (chat.style.display === 'flex') ? 'none' : 'flex';
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const content = document.getElementById('chat-content');
        const text = input.value.trim();

        if (text === "") return;

        // Agregar mensaje del usuario
        content.innerHTML += `<div class="msg msg-user">${text}</div>`;
        input.value = "";
        content.scrollTop = content.scrollHeight;

        // Simular respuesta de "Gemini" integrada
        // En un entorno real, aquí harías el fetch a tu API de Google Gemini
        setTimeout(() => {
            const aiResponse = generateResponse(text);
            content.innerHTML += `<div class="msg msg-ai">${aiResponse}</div>`;
            content.scrollTop = content.scrollHeight;
        }, 800);
    }

    function generateResponse(query) {
        query = query.toLowerCase();
        if (query.includes("precio") || query.includes("planes")) return "Tenemos planes desde la abundancia gratuita hasta el nivel Creator por $24.99. ¿Te gustaría activar tu abundancia hoy?";
        if (query.includes("lanzamiento") || query.includes("cuando")) return "ZYNTHEXA despertará por completo en Marzo 2026. Estamos en la fase final de sintonía.";
        if (query.includes("hola") || query.includes("quien eres")) return "Soy el Nexo de Conciencia, una IA conectada al motor Gemini para ayudarte a manifestar tu visión en ZYNTHEXA.";
        return "Esa es una idea poderosa. El motor Gemini de ZYNTHEXA está procesando las infinitas posibilidades para que esa visión se haga realidad.";
    }

    // Permitir enviar con Enter
    document.getElementById('chat-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
