<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNTHEXA - Creando el Futuro de la Humanidad</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #00e5ff; --secondary: #8b5cf6; --accent: #10b981;
  --dark: #0a0118; --darker: #050008; --light: #f0f9ff;
}
body { font-family: 'Rajdhani', sans-serif; background: var(--darker); color: var(--light); overflow-x: hidden; line-height: 1.6; }
body::before {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 10% 20%, rgba(139,92,246,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(0,229,255,0.12) 0%, transparent 50%);
  z-index: 0; pointer-events: none;
}
.container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
nav { position: fixed; top:0; left:0; right:0; background: rgba(10,1,24,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,229,255,0.2); padding: 20px 0; z-index: 1000; }
nav .container { display:flex; justify-content:space-between; align-items:center; }
.logo { font-family:'Exo 2',sans-serif; font-size:2rem; font-weight:900; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:120px 20px; }
.hero h1 { font-family:'Exo 2',sans-serif; font-size:4.5rem; font-weight:900; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.btn-primary { padding:15px 35px; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:var(--dark); border-radius:8px; font-weight:700; border:none; cursor:pointer; text-transform:uppercase; font-family:'Rajdhani'; }

/* CHATBOT STYLES */
#chat-toggle { position:fixed; bottom:30px; right:30px; width:65px; height:65px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); border:none; cursor:pointer; z-index:9999; font-size:1.8rem; box-shadow: 0 0 20px var(--primary); }
#chat-window { position:fixed; bottom:110px; right:30px; width:380px; height:550px; background:rgba(5,0,8,0.95); border:1px solid var(--primary); border-radius:20px; display:none; flex-direction:column; z-index:9998; backdrop-filter:blur(15px); }
#chat-window.open { display:flex; }
.chat-header { padding:20px; border-bottom:1px solid rgba(0,229,255,0.2); display:flex; align-items:center; gap:10px; }
.chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:85%; padding:10px 15px; border-radius:12px; margin:5px 0; }
.msg.bot { background:rgba(139,92,246,0.2); align-self:flex-start; border-left: 3px solid var(--primary); }
.msg.user { background:rgba(0,229,255,0.2); align-self:flex-end; border-right: 3px solid var(--secondary); }
.chat-input-area { padding:15px; display:flex; gap:10px; }
#chat-input { flex:1; background:rgba(255,255,255,0.1); border:1px solid var(--primary); padding:10px; color:white; border-radius:8px; outline:none; font-family:'Rajdhani'; }
#chat-send { background:var(--primary); border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>

<nav>
  <div class="container">
    <div class="logo">ZYNTHEXA</div>
    <button class="btn-primary" onclick="toggleChat()">Asistente IA</button>
  </div>
</nav>

<section class="hero">
  <div class="container">
    <h1>ZYNTHEXA</h1>
    <p style="font-size:1.5rem; margin:20px 0;">Creando el Futuro de la Humanidad</p>
    <button class="btn-primary" onclick="toggleChat()">Habla con Nuestra IA</button>
  </div>
</section>

<button id="chat-toggle" onclick="toggleChat()">💬</button>
<div id="chat-window" id="chatWin">
  <div class="chat-header">
    <div style="width:10px; height:10px; background:var(--accent); border-radius:50%;"></div>
    <span style="font-weight:bold; color:var(--primary);">ZYNTHEXA AI</span>
  </div>
  <div class="chat-messages" id="msgs">
    <div class="msg bot">¡Conexión Exitosa! 🚀 Soy Zynthexa AI. ¿Cómo vamos a cambiar el mundo hoy?</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
    <button id="chat-send" onclick="send()">➤</button>
  </div>
</div>

<script>
function toggleChat() {
  const win = document.getElementById('chat-window');
  win.classList.toggle('open');
}

async function send() {
  const inp = document.getElementById('chat-input');
  const txt = inp.value.trim();
  if (!txt) return;

  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div class="msg user">${txt}</div>`;
  inp.value = '';
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: txt }] })
    });
    const data = await res.json();
    const reply = data.content ? data.content[0].text : "Estoy procesando tu solicitud...";
    msgs.innerHTML += `<div class="msg bot">${reply}</div>`;
  } catch (e) {
    msgs.innerHTML += `<div class="msg bot">Error de conexión.</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

document.getElementById('chat-input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
